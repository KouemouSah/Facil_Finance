version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    target-branch: develop
    labels: [dependances, "zone:ci"]
    commit-message: {prefix: "ci(deps)"}
    groups:
      actions: {patterns: ["*"]}

  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly, day: monday}
    target-branch: develop
    labels: [dependances, "zone:moteur"]
    commit-message: {prefix: "build(deps)"}

  - package-ecosystem: pip
    directory: /docs
    schedule: {interval: monthly}
    target-branch: develop
    labels: [dependances, "zone:docs"]
    commit-message: {prefix: "build(deps)"}

  - package-ecosystem: pip
    directory: /plugin/compta-ohada/serveur
    schedule: {interval: monthly}
    target-branch: develop
    labels: [dependances, "zone:plugin"]
    commit-message: {prefix: "build(deps)"}
    ignore:
      # Version FIGÉE : celle avec laquelle la lecture OCR a été mise au point et prouvée (tests/test_ocr_def.py).
      - dependency-name: rapidocr_onnxruntime
